{% extends "base.html" %}
{% block title %}Login — {{ platform_name }}{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Log in to your {{ platform_name }} account.</p>
            </div>
            <form method="post" class="auth-form">
                <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="form-row-between">
                    <label class="checkbox"><input type="checkbox" name="remember"> Remember me</label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="link-gold">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-gold btn-block btn-lg">Login</button>
            </form>
            <div class="auth-footer">
                <p>Don't have an account?</p>
                <a href="{{ url_for('auth.register_student') }}" class="link-gold">Join as Student</a> |
                <a href="{{ url_for('auth.register_client') }}" class="link-gold">Register as Client</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
