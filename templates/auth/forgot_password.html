{% extends "base.html" %}
{% block title %}Forgot Password — {{ platform_name }}{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Reset Password</h2>
                <p>Enter your email to receive a reset link.</p>
            </div>
            {% if step == 'reset' %}
            <form method="post" action="{{ url_for('auth.reset_password') }}" class="auth-form">
                <input type="hidden" name="email" value="{{ email }}">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="password" class="form-control" minlength="8" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-gold btn-block">Update Password</button>
            </form>
            {% else %}
            <form method="post" class="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-gold btn-block">Send Reset Link</button>
            </form>
            {% endif %}
            <div class="auth-footer">
                <p><a href="{{ url_for('auth.login') }}" class="link-gold">Back to Login</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
