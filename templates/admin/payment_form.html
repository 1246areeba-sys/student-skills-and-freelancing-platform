{% extends "admin/base.html" %}
{% set title = 'Payment' %}
{% block admin_content %}
<div class="panel narrow-panel">
    <div class="panel-head"><h3>{% if payment %}Edit Payment{% else %}Add Payment{% endif %}</h3></div>
    <form method="post" action="{% if payment %}{{ url_for('admin.edit_payment', payment_id=payment.id) }}{% else %}{{ url_for('admin.add_payment') }}{% endif %}">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
        <div class="form-group">
            <label>Project *</label>
            <select name="project_id" class="form-control" required>
                <option value="">— Select Project —</option>
                {% for p in projects %}
                <option value="{{ p.id }}" {% if payment and p.id == payment.project_id %}selected{% endif %}>{{ p.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Client *</label>
            <select name="client_id" class="form-control" required>
                <option value="">— Select Client —</option>
                {% for c in clients %}
                <option value="{{ c.id }}" {% if payment and c.id == payment.client_id %}selected{% endif %}>{{ c.user.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Student *</label>
            <select name="student_id" class="form-control" required>
                <option value="">— Select Student —</option>
                {% for s in students %}
                <option value="{{ s.id }}" {% if payment and s.id == payment.student_id %}selected{% endif %}>{{ s.user.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Amount ($) *</label>
                <input type="number" step="0.01" name="amount" class="form-control" value="{{ payment.amount or 0 if payment else 0 }}" min="0.01" required>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select name="status" class="form-control">
                    {% for opt in ['pending', 'processing', 'paid', 'failed', 'refunded'] %}
                    <option value="{{ opt }}" {% if payment and payment.status == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Payment Method</label>
            <input type="text" name="payment_method" class="form-control" value="{{ payment.payment_method if payment else 'Platform Balance' }}">
        </div>
        <div class="form-group">
            <label>Transaction Reference</label>
            <input type="text" name="transaction_reference" class="form-control" value="{{ payment.transaction_reference if payment else '' }}">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save</button>
        <a href="{{ url_for('admin.payments') }}" class="btn btn-outline-gold btn-block">Cancel</a>
    </form>
</div>
{% endblock %}
