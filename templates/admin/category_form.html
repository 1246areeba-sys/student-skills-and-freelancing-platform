{% extends "admin/base.html" %}
{% set title = 'Edit Category' %}
{% block admin_content %}
<div class="panel narrow-panel">
    <div class="panel-head"><h3>Edit Category</h3></div>
    <form method="post" action="{{ url_for('admin.edit_category', category_id=category.id) }}">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3">{{ category.description or '' }}</textarea>
        </div>
        <div class="form-group">
            <label>Icon (FontAwesome class)</label>
            <input type="text" name="icon" class="form-control" value="{{ category.icon or 'briefcase' }}">
        </div>
        <button class="btn btn-primary btn-block">Save Changes</button>
        <a href="{{ url_for('admin.categories') }}" class="btn btn-outline-gold btn-block">Cancel</a>
    </form>
</div>
{% endblock %}
