{% extends "admin/base.html" %}
{% set title = 'Edit Skill' %}
{% block admin_content %}
<div class="panel narrow-panel">
    <div class="panel-head"><h3>Edit Skill</h3></div>
    <form method="post" action="{{ url_for('admin.edit_skill', skill_id=skill.id) }}">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
        <div class="form-group">
            <label>Name *</label>
            <input type="text" name="name" class="form-control" value="{{ skill.name }}" required>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select name="category_id" class="form-control">
                <option value="">— None —</option>
                {% for c in categories %}
                <option value="{{ c.id }}" {% if c.id == skill.category_id %}selected{% endif %}>{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
        <a href="{{ url_for('admin.skills') }}" class="btn btn-outline-gold btn-block">Cancel</a>
    </form>
</div>
{% endblock %}
