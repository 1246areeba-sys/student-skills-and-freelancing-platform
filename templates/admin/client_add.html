{% extends "admin/base.html" %}
{% set title = 'Add Client' %}
{% block admin_content %}
<div class="panel narrow-panel">
    <div class="panel-head"><h3>Add New Client</h3></div>
    <form method="post" action="{{ url_for('admin.add_client') }}" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
        <div class="form-row">
            <div class="form-group">
                <label>Contact Name <span class="req">*</span></label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Email <span class="req">*</span></label>
                <input type="email" name="email" class="form-control" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Password <span class="req">*</span></label>
                <input type="password" name="password" class="form-control" minlength="8" required>
            </div>
            <div class="form-group">
                <label>Confirm Password <span class="req">*</span></label>
                <input type="password" name="confirm_password" class="form-control" minlength="8" required>
            </div>
        </div>
        <div class="form-group">
            <label>Company / Organization <span class="req">*</span></label>
            <input type="text" name="company_name" class="form-control" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control">
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" class="form-control">
            </div>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Profile Picture</label>
            <input type="file" name="profile_picture" class="form-control" accept="image/*">
        </div>
        <button class="btn btn-primary btn-block">Create Client</button>
        <a href="{{ url_for('admin.clients') }}" class="btn btn-outline-gold btn-block">Cancel</a>
    </form>
</div>
{% endblock %}
