{% extends "admin/base.html" %}
{% set title = 'Add Proposal' %}
{% block admin_content %}
<div class="panel narrow-panel">
    <div class="panel-head"><h3>Add Proposal</h3></div>
    <form method="post" action="{{ url_for('admin.add_proposal') }}">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
        <div class="form-group">
            <label>Project *</label>
            <select name="project_id" class="form-control" required>
                <option value="">Select Project</option>
                {% for pr in projects %}
                <option value="{{ pr.id }}">{{ pr.title }} ({{ pr.client.company_name or pr.client.user.name }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Student *</label>
            <select name="student_id" class="form-control" required>
                <option value="">Select Student</option>
                {% for st in students %}
                <option value="{{ st.id }}">{{ st.user.name }} ({{ st.university or 'Independent' }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Cover Letter *</label>
            <textarea name="cover_letter" class="form-control" rows="6" required placeholder="Explain why the student is a great fit..."></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Proposed Price ($)</label>
                <input type="number" step="0.01" name="proposed_price" class="form-control" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Delivery Time (days)</label>
                <input type="number" name="delivery_time" class="form-control" value="7" min="1">
            </div>
        </div>
        <div class="form-group">
            <label>Relevant Skills</label>
            <input type="text" name="relevant_skills" class="form-control" placeholder="e.g. Python, Flask, React">
        </div>
        <div class="form-group">
            <label>Portfolio Samples (links, comma separated)</label>
            <input type="text" name="portfolio_samples" class="form-control" placeholder="https://..., https://...">
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status" class="form-control">
                {% for opt in ['pending', 'accepted', 'rejected', 'withdrawn'] %}
                <option value="{{ opt }}" {% if opt == 'pending' %}selected{% endif %}>{{ opt }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-paper-plane"></i> Create Proposal</button>
        <a href="{{ url_for('admin.proposals') }}" class="btn btn-outline-gold btn-block">Cancel</a>
    </form>
</div>
{% endblock %}
