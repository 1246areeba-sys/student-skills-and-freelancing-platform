{% extends "admin/base.html" %}
{% set title = 'Review' %}
{% block admin_content %}
<div class="panel narrow-panel">
    <div class="panel-head"><h3>{% if review %}Edit Review{% else %}Add Review{% endif %}</h3></div>
    <form method="post" action="{% if review %}{{ url_for('admin.edit_review', review_id=review.id) }}{% else %}{{ url_for('admin.add_review') }}{% endif %}">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
        <div class="form-group">
            <label>Project *</label>
            <select name="project_id" class="form-control" required>
                <option value="">— Select Project —</option>
                {% for p in projects %}
                <option value="{{ p.id }}" {% if review and p.id == review.project_id %}selected{% endif %}>{{ p.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Reviewer *</label>
            <select name="reviewer_id" class="form-control" required>
                <option value="">— Select User —</option>
                {% for u in users %}
                <option value="{{ u.id }}" {% if review and u.id == review.reviewer_id %}selected{% endif %}>{{ u.name }} ({{ u.role }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Reviewed User *</label>
            <select name="reviewed_user_id" class="form-control" required>
                <option value="">— Select User —</option>
                {% for u in users %}
                <option value="{{ u.id }}" {% if review and u.id == review.reviewed_user_id %}selected{% endif %}>{{ u.name }} ({{ u.role }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Rating (1-5)</label>
            <input type="number" name="rating" class="form-control" value="{{ review.rating if review else 5 }}" min="1" max="5">
        </div>
        <div class="form-group">
            <label>Review</label>
            <textarea name="review" class="form-control" rows="4">{{ review.review if review else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save</button>
        <a href="{{ url_for('admin.reviews') }}" class="btn btn-outline-gold btn-block">Cancel</a>
    </form>
</div>
{% endblock %}
