{% extends "admin/base.html" %}
{% set title = 'Edit Milestone' %}
{% block admin_content %}
<div class="panel narrow-panel">
    <div class="panel-head"><h3>Edit Milestone — {{ milestone.title }}</h3></div>
    <form method="post" action="{{ url_for('admin.edit_milestone', milestone_id=milestone.id) }}">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" class="form-control" value="{{ milestone.title }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3">{{ milestone.description or '' }}</textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Amount ($)</label>
                <input type="number" step="0.01" name="amount" class="form-control" value="{{ milestone.amount or 0 }}">
            </div>
            <div class="form-group">
                <label>Deadline</label>
                <input type="date" name="deadline" class="form-control" value="{{ milestone.deadline.isoformat() if milestone.deadline else '' }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Status</label>
                <select name="status" class="form-control">
                    {% for opt in ['pending', 'in_progress', 'submitted', 'approved', 'revision', 'completed'] %}
                    <option value="{{ opt }}" {% if milestone.status == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Payment Status</label>
                <select name="payment_status" class="form-control">
                    {% for opt in ['unpaid', 'paid'] %}
                    <option value="{{ opt }}" {% if milestone.payment_status == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button class="btn btn-primary btn-block">Save Changes</button>
        <a href="{{ url_for('admin.milestones') }}" class="btn btn-outline-gold btn-block">Cancel</a>
    </form>
</div>
{% endblock %}
