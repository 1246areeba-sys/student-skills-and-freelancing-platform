{% extends "admin/base.html" %}
{% set title = 'Create Project' %}
{% block admin_content %}
<div class="panel narrow-panel">
    <div class="panel-head"><h3>Create Project</h3></div>
    <form method="post" action="{{ url_for('admin.create_project') }}">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">

        <div class="form-group">
            <label>Project Title <span class="req">*</span></label>
            <input type="text" name="title" class="form-control" placeholder="e.g. Build a Student Portfolio Website" required>
        </div>

        <div class="form-group">
            <label>Description <span class="req">*</span></label>
            <textarea name="description" class="form-control" rows="5" placeholder="Describe the project scope, deliverables and expectations" required></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Client <span class="req">*</span></label>
                <select name="client_id" class="form-control" required>
                    <option value="">— Select Client —</option>
                    {% for c in clients %}
                    <option value="{{ c.id }}">{{ c.user.name }} ({{ c.company_name or 'No company' }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select name="category_id" class="form-control">
                    <option value="">— None —</option>
                    {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Required Skills</label>
            <select name="skills" class="form-control" multiple size="6">
                {% for s in skills %}
                <option value="{{ s.id }}">{{ s.name }}</option>
                {% endfor %}
            </select>
            <small class="muted">Hold Ctrl / Cmd to select multiple skills.</small>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Budget ($)</label>
                <input type="number" step="0.01" name="budget" class="form-control" value="0">
            </div>
            <div class="form-group">
                <label>Deadline</label>
                <input type="date" name="deadline" class="form-control">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Project Status</label>
                <select name="status" class="form-control">
                    {% for opt in ['draft', 'open', 'in_progress', 'completed', 'cancelled', 'closed'] %}
                    <option value="{{ opt }}" {% if opt == 'open' %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Project Type</label>
                <select name="project_type" class="form-control">
                    {% for opt in ['Fixed', 'Hourly'] %}
                    <option value="{{ opt }}">{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Location Type</label>
                <select name="location_type" class="form-control">
                    {% for opt in ['Remote', 'Onsite', 'Hybrid'] %}
                    <option value="{{ opt }}">{{ opt }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" class="form-control" placeholder="e.g. Lahore, Pakistan">
            </div>
        </div>

        <div class="form-group">
            <label>Freelancers Needed</label>
            <input type="number" name="freelancers_needed" class="form-control" value="1" min="1">
        </div>

        <button class="btn btn-primary btn-block">Create Project</button>
        <a href="{{ url_for('admin.projects') }}" class="btn btn-outline-gold btn-block">Cancel</a>
    </form>
</div>
{% endblock %}
