{% extends "admin/base.html" %}
{% set title = 'Edit Client' %}
{% block admin_content %}
<div class="panel narrow-panel">
    <div class="panel-head"><h3>Edit Client — {{ client.user.name }}</h3></div>
    <form method="post" action="{{ url_for('admin.edit_client', client_id=client.id) }}">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
        <div class="form-group">
            <label>Company Name</label>
            <input type="text" name="company_name" class="form-control" value="{{ client.company_name or '' }}">
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3">{{ client.description or '' }}</textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ client.phone or '' }}">
            </div>
            <div class="form-group">
                <label>City</label>
                <input type="text" name="city" class="form-control" value="{{ client.city or '' }}">
            </div>
        </div>
        <button class="btn btn-primary btn-block">Save Changes</button>
        <a href="{{ url_for('admin.clients') }}" class="btn btn-outline-gold btn-block">Cancel</a>
    </form>
</div>
{% endblock %}
