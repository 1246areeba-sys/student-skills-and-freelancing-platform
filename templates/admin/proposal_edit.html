{% extends "admin/base.html" %}
{% set title = 'Edit Proposal' %}
{% block admin_content %}
<div class="panel narrow-panel">
    <div class="panel-head"><h3>Edit Proposal</h3></div>
    <form method="post" action="{{ url_for('admin.edit_proposal', proposal_id=proposal.id) }}">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
        <div class="form-group">
            <label>Project *</label>
            <select name="project_id" class="form-control" required>
                {% for pr in projects %}
                <option value="{{ pr.id }}" {% if pr.id == proposal.project_id %}selected{% endif %}>{{ pr.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Student *</label>
            <select name="student_id" class="form-control" required>
                {% for st in students %}
                <option value="{{ st.id }}" {% if st.id == proposal.student_id %}selected{% endif %}>{{ st.user.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Cover Letter *</label>
            <textarea name="cover_letter" class="form-control" rows="6" required>{{ proposal.cover_letter }}</textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Proposed Price ($)</label>
                <input type="number" step="0.01" name="proposed_price" class="form-control" value="{{ proposal.proposed_price }}" min="0">
            </div>
            <div class="form-group">
                <label>Delivery Time (days)</label>
                <input type="number" name="delivery_time" class="form-control" value="{{ proposal.delivery_time }}" min="1">
            </div>
        </div>
        <div class="form-group">
            <label>Relevant Skills</label>
            <input type="text" name="relevant_skills" class="form-control" value="{{ proposal.relevant_skills or '' }}">
        </div>
        <div class="form-group">
            <label>Portfolio Samples</label>
            <input type="text" name="portfolio_samples" class="form-control" value="{{ proposal.portfolio_samples or '' }}">
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status" class="form-control">
                {% for opt in ['pending', 'accepted', 'rejected', 'withdrawn'] %}
                <option value="{{ opt }}" {% if opt == proposal.status %}selected{% endif %}>{{ opt }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
        <a href="{{ url_for('admin.proposals') }}" class="btn btn-outline-gold btn-block">Cancel</a>
    </form>
</div>
{% endblock %}
