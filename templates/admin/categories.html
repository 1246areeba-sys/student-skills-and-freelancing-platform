{% extends "admin/base.html" %}
{% set title = 'Categories' %}
{% block admin_content %}
<div class="panel">
    <form method="post" action="{{ url_for('admin.categories') }}" class="admin-filter-bar">
        <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
        <input type="text" name="name" class="form-control" placeholder="New category name..." required>
        <input type="text" name="description" class="form-control" placeholder="Description...">
        <input type="text" name="icon" class="form-control" placeholder="icon (e.g. briefcase)" value="briefcase">
        <button class="btn btn-primary btn-sm">Add</button>
    </form>

    <table class="admin-table">
        <thead><tr><th>Name</th><th>Description</th><th>Icon</th><th>Actions</th></tr></thead>
        <tbody>
        {% for c in categories %}
        <tr>
            <td>{{ c.name }}</td>
            <td class="muted small">{{ c.description or '—' }}</td>
            <td><i class="fa-solid fa-{{ c.icon }}"></i> {{ c.icon }}</td>
            <td class="admin-actions">
                <a href="{{ url_for('admin.edit_category', category_id=c.id) }}" class="btn btn-outline-primary btn-sm">Edit</a>
                <form method="post" action="{{ url_for('admin.delete_category', category_id=c.id) }}" class="inline-form" onsubmit="return confirm('Delete this category?')">
                    <input type="hidden" name="csrf_token" value="{{ session['_csrf_token'] }}">
                    <button class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash"></i></button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    {% if not categories %}<p class="muted empty-inline">No categories yet.</p>{% endif %}
</div>
{% endblock %}
