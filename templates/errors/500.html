{% extends "base.html" %}
{% block title %}Server Error — {{ platform_name }}{% endblock %}
{% block content %}
<section class="error-section">
    <div class="container text-center">
        <div class="error-code">500</div>
        <h1>Something Went Wrong</h1>
        <p class="error-text">We're experiencing a technical issue. Please try again in a moment.</p>
        <div class="error-actions">
            <a href="{{ url_for('home.index') }}" class="btn btn-primary">Back to Home</a>
            <a href="javascript:history.back()" class="btn btn-gold">Go Back</a>
        </div>
    </div>
</section>
{% endblock %}
