{% extends "base.html" %}
{% block title %}Page Not Found — {{ platform_name }}{% endblock %}
{% block content %}
<section class="error-section">
    <div class="container text-center">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p class="error-text">The page you are looking for doesn't exist or has been moved.</p>
        <div class="error-actions">
            <a href="{{ url_for('home.index') }}" class="btn btn-primary">Back to Home</a>
            <a href="{{ url_for('projects.projects') }}" class="btn btn-gold">Browse Projects</a>
        </div>
    </div>
</section>
{% endblock %}
